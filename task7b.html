
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        .gallery {
            background: white;
            width: 600px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
        }

        #mainImage {
            width: 500px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        .thumbnails img {
            width: 100px;
            height: 70px;
            object-fit: cover;
            margin: 10px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .thumbnails img:hover {
            border: 2px solid blue;
        }
    </style>
</head>

<body>

<div class="gallery">

    <h2>My Image Gallery</h2>

    <img id="mainImage"
    src="https://picsum.photos/id/1015/600/400">

    <div class="thumbnails">

        <img src="https://picsum.photos/id/1015/600/400"
             class="thumb">

        <img src="https://picsum.photos/id/1016/600/400"
             class="thumb">

        <img src="https://picsum.photos/id/1018/600/400"
             class="thumb">

        <img src="https://picsum.photos/id/1020/600/400"
             class="thumb">

    </div>

</div>

<script>

    let mainImage = document.getElementById("mainImage");

    let thumbnails = document.querySelectorAll(".thumb");

    thumbnails.forEach(function(image) {

        image.addEventListener("click", function() {

            mainImage.src = image.src;

        });

    });

</script>

</body>
</html>
